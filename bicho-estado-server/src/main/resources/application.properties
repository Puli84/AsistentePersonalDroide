spring.application.name=bicho-estado-server
server.port=8080

# Un poco de log para ver en la consola los cambios de estado y las conexiones/desconexiones
logging.level.com.danipuli.bicho=INFO

# --- Conexión MCP con xiaozhi.me ---
# 1. En xiaozhi.me: tu agente -> Extensions -> Custom Services -> MCP Endpoint -> copia la Endpoint URL
# 2. Pégala en src/main/resources/secrets.properties (NO se sube a git, está en .gitignore):
#      bicho.mcp.endpoint-url=wss://api.xiaozhi.me/mcp/?token=...
#    o defínela en la variable de entorno BICHO_MCP_ENDPOINT_URL
# 3. Pon bicho.mcp.enabled=true
# 4. Reinicia el servidor. En consola debería salir "Conectado al endpoint MCP de xiaozhi.me"
#    y en la web de xiaozhi.me el estado debería pasar de "Not Connected" a "Connected".
bicho.mcp.enabled=true
bicho.mcp.endpoint-url=${BICHO_MCP_ENDPOINT_URL:}

# --- Asistente propio: Claude (cerebro) + OpenAI (voz) ---
# Las API keys van en secrets.properties (bicho.anthropic.api-key / bicho.openai.api-key)
# o en las variables de entorno ANTHROPIC_API_KEY / OPENAI_API_KEY.
bicho.anthropic.api-key=${ANTHROPIC_API_KEY:}
bicho.anthropic.modelo=claude-sonnet-5
# Personalidad del bicho: fichero de texto que se relee en cada conversación (sin reiniciar).
# Ruta relativa a la carpeta del proyecto, o absoluta.
bicho.personalidad.fichero=personalidad.txt
# Memoria a largo plazo (datos que apunta Claude con la herramienta recordar; editable a mano)
bicho.memoria.fichero=memoria.txt
# Conversación reciente guardada para seguirla tras reiniciar ("Olvidar conversación" la borra)
bicho.conversacion.fichero=conversacion.json
bicho.openai.api-key=${OPENAI_API_KEY:}
bicho.openai.modelo-stt=gpt-4o-mini-transcribe
bicho.openai.modelo-tts=gpt-4o-mini-tts
bicho.openai.voz=coral
# Pista para la transcripción: palabras que tiene que escribir bien
bicho.openai.pista-stt=Hablando con RoboDragón, el robot de Daniel.

# --- Palabra de activación (escucha continua de la ESP32) ---
# Nombres a los que responde, separados por comas (sin importar mayúsculas, tildes ni espacios)
bicho.activacion.nombres=RoboDragón
# Segundos tras una respuesta en los que puedes seguir hablando sin decir el nombre
bicho.activacion.ventana-segundos=8

# Zona horaria para decirle a Claude la fecha y la hora
bicho.zona-horaria=Europe/Madrid

# Límites de seguridad de las ruedas (el servidor recorta lo que pida Claude)
bicho.ruedas.duracion-max-ms=3000
bicho.ruedas.velocidad-max=70

# Subida de audio desde la web (grabaciones cortas)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Secretos locales (token de xiaozhi.me, API keys)
spring.config.import=optional:classpath:secrets.properties
